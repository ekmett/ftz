name: Native packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 LLVM 23 / AVX2
            runner: ubuntu-24.04
            profile: AVX2
          - name: Linux ARM64 LLVM 23 / NEON
            runner: ubuntu-24.04-arm
            profile: NEON
          - name: macOS ARM64 LLVM 23 / NEON
            runner: macos-15
            profile: NEON
          - name: Windows x64 LLVM 23 / AVX2
            runner: windows-2025
            profile: AVX2
          - name: Windows ARM64 LLVM 23 / NEON
            runner: windows-11-arm
            profile: NEON
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check out the qualified SIMD dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ekmett/simd
          ref: 9c03aa5464f611caf8d7acd4b059b498f7991162
          path: build/deps/simd
          persist-credentials: false
      # Use the setup actions from the same pinned, qualified SIMD revision.
      - uses: ./build/deps/simd/.github/actions/setup/ubuntu/compiler
        if: runner.os == 'Linux'
      - uses: ./build/deps/simd/.github/actions/setup/ubuntu/build-tools
        if: runner.os == 'Linux'
      - uses: ./build/deps/simd/.github/actions/setup/macos/compiler
        if: runner.os == 'macOS'
      - uses: ./build/deps/simd/.github/actions/setup/macos/build-tools
        if: runner.os == 'macOS'
      # Windows setup copied from SIMD 8f69034; numerical dependency remains pinned above.
      - uses: ./.github/actions/setup/windows
        if: runner.os == 'Windows'
      - name: Set up compiler cache
        id: sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.16.0
      - name: Check compiler cache launcher
        if: runner.os != 'Windows'
        run: |
          python3 -B .github/scripts/test_sccache_launcher.py
          python3 -B .github/scripts/test_sccache_pch.py "$(command -v clang++)" "$GITHUB_WORKSPACE/build/sccache-pch-probe"
      - name: Record Windows hardware and admit the test architecture
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TEST_PROFILE: ${{ matrix.profile }}
        run: |
          New-Item -ItemType Directory -Force build/logs | Out-Null
          & {
            git rev-parse HEAD
            git -C build/deps/simd rev-parse HEAD
            Get-CimInstance Win32_Processor | Format-List Name, Manufacturer, Architecture, NumberOfCores
            Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, OSArchitecture
            clang-cl --version
            clang-scan-deps --version
            cmake --version
            ninja --version
            "AVX2=$([System.Runtime.Intrinsics.X86.Avx2]::IsSupported)"
            "FMA=$([System.Runtime.Intrinsics.X86.Fma]::IsSupported)"
            "BMI2=$([System.Runtime.Intrinsics.X86.Bmi2]::IsSupported)"
            "NEON=$([System.Runtime.Intrinsics.Arm.AdvSimd]::IsSupported)"
          } | Tee-Object build/logs/environment.log
          if ($env:TEST_PROFILE -eq 'AVX2') {
            if ($env:RUNNER_ARCH -ne 'X64' -or
                -not [System.Runtime.Intrinsics.X86.Avx2]::IsSupported -or
                -not [System.Runtime.Intrinsics.X86.Fma]::IsSupported -or
                -not [System.Runtime.Intrinsics.X86.Bmi2]::IsSupported) {
              throw 'AVX2 tests require native x64 with AVX2, FMA and BMI2.'
            }
          } elseif ($env:RUNNER_ARCH -ne 'ARM64' -or
                    -not [System.Runtime.Intrinsics.Arm.AdvSimd]::IsSupported) {
            throw 'NEON tests require native ARM64 with Advanced SIMD.'
          }
          "Native Windows CPU tests: $env:RUNNER_ARCH / $env:TEST_PROFILE. Exceptions, PCH and IPO remain enabled. All numerical, package and relocated-consumer tests run; no filter is applied." >> $env:GITHUB_STEP_SUMMARY
      - name: Record toolchain and admit the test architecture
        if: runner.os != 'Windows'
        run: |
          mkdir -p build/logs
          {
            git rev-parse HEAD
            git -C build/deps/simd rev-parse HEAD
            uname -a
            if [[ "$RUNNER_OS" == Linux ]]; then
              cat /etc/os-release
              lscpu
              cat /proc/cpuinfo
            else
              sw_vers
              sysctl -a | grep -E '^(machdep.cpu|hw.machine|hw.model|hw.ncpu|hw.optional)' || true
            fi
            clang++ --version
            clang-scan-deps --version
            cmake --version
            ninja --version
          } | tee build/logs/environment.log
          arch=$(uname -m)
          if [[ "${{ matrix.profile }}" == AVX2 ]]; then
            [[ "$arch" == x86_64 ]] || {
              echo "::error::The AVX2 profile requires an x86_64 runner."
              exit 1
            }
            if [[ "$RUNNER_OS" == Linux ]]; then
              features=$(grep -m1 '^flags' /proc/cpuinfo)
            else
              features=$(sysctl -n machdep.cpu.features machdep.cpu.leaf7_features)
            fi
            features=$(printf '%s' "$features" | tr '[:upper:]' '[:lower:]')
            for feature in avx2 fma bmi2; do
              grep -qw "$feature" <<< "$features" || {
                echo "::error::This test profile requires $feature on the runner."
                exit 1
              }
            done
          else
            [[ "$arch" == arm64 || "$arch" == aarch64 ]] || {
              echo "::error::The NEON profile requires an ARM64 runner."
              exit 1
            }
            if [[ "$RUNNER_OS" == Linux ]]; then
              grep -qw asimd /proc/cpuinfo || {
                echo "::error::The NEON profile requires Advanced SIMD on the runner."
                exit 1
              }
            fi
          fi
          echo 'Exceptions, PCH and IPO are enabled in both packages. All configured tests run; no filter is applied.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Linux and Windows cover native AVX2 and NEON; macOS covers native NEON. AVX-512 and the two-x86-profile fixture are outside this workflow. This is CPU package qualification, not a GPU run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build and install SIMD
        run: |
          compiler=clang++
          launcher=sccache
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler=clang-cl
          else
            launcher="$(command -v python3);$GITHUB_WORKSPACE/.github/scripts/sccache_launcher.py"
          fi
          if [[ "$RUNNER_OS" != macOS ]]; then extra+=(-DCMAKE_LINKER_TYPE=LLD); fi
          cmake -S build/deps/simd -B build/simd -G Ninja \
            -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$launcher" \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DSIMD_BUILD_TESTS=OFF -DSIMD_BUILD_DOCS=OFF \
            -DSIMD_ENABLE_EXCEPTIONS=ON -DSIMD_ENABLE_PCH=ON -DSIMD_ENABLE_IPO=ON \
            -DSIMD_PROFILES="${{ matrix.profile }}" "${extra[@]}" \
            2>&1 | tee build/logs/simd-configure.log
          cmake --build build/simd --parallel 2 2>&1 | tee build/logs/simd-build.log
          cmake --install build/simd --prefix "$GITHUB_WORKSPACE/build/install/simd" \
            2>&1 | tee build/logs/simd-install.log
      - name: Install optional accuracy oracle (Linux x64 only)
        if: matrix.runner == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libmpfr-dev
      - name: Build and test FTZ
        run: |
          compiler=clang++
          launcher=sccache
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            compiler=clang-cl
          else
            launcher="$(command -v python3);$GITHUB_WORKSPACE/.github/scripts/sccache_launcher.py"
          fi
          if [[ "$RUNNER_OS" != macOS ]]; then extra+=(-DCMAKE_LINKER_TYPE=LLD); fi
          cmake -S . -B build/ftz -G Ninja \
            -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$launcher" \
            -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -Dsimd_DIR="$GITHUB_WORKSPACE/build/install/simd/lib/cmake/simd" \
            -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF \
            -DFTZ_BUILD_TESTS=ON -DFTZ_BUILD_DOCS=OFF \
            -DFTZ_BUILD_MPFR_TESTS=${{ matrix.runner == 'ubuntu-24.04' }} \
            -DFTZ_ENABLE_EXCEPTIONS=ON -DFTZ_ENABLE_PCH=ON -DFTZ_ENABLE_IPO=ON \
            -DFTZ_TEST_ISA="${{ matrix.profile }}" -DFTZ_TEST_PROFILES="${{ matrix.profile }}" \
            "${extra[@]}" 2>&1 | tee build/logs/ftz-configure.log
          cmake --build build/ftz --parallel 2 2>&1 | tee build/logs/ftz-build.log
          ctest --test-dir build/ftz --show-only=json-v1 > build/logs/ftz-tests.json
          ctest --test-dir build/ftz --no-tests=error --output-on-failure \
            --output-junit "$GITHUB_WORKSPACE/build/logs/ftz-tests.xml" \
            2>&1 | tee build/logs/ftz-test.log
      - name: Relocate both installed packages
        run: |
          cmake --install build/ftz --prefix "$GITHUB_WORKSPACE/build/install/ftz" \
            2>&1 | tee build/logs/ftz-install.log
          mkdir -p 'build/relocated packages'
          cmake -E rename build/install/simd 'build/relocated packages/simd'
          cmake -E rename build/install/ftz 'build/relocated packages/ftz'
      - name: Test installed module consumers
        run: |
          compiler=clang++
          extra=()
          if [[ "$RUNNER_OS" == Windows ]]; then compiler=clang-cl; fi
          if [[ "$RUNNER_OS" != macOS ]]; then extra+=(-DCMAKE_LINKER_TYPE=LLD); fi
          for suite in package api; do
            options=()
            if [[ "$suite" == package ]]; then
              options+=(-DTEST_ISA="${{ matrix.profile }}" -DTEST_PCH=ON -DTEST_IPO=ON)
            else
              options+=(-DAPI_PROFILES="${{ matrix.profile }}")
            fi
            cmake -S "tests/$suite" -B "build/$suite" -G Ninja \
              -DCMAKE_CXX_COMPILER="$compiler" -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -Dsimd_DIR="$GITHUB_WORKSPACE/build/relocated packages/simd/lib/cmake/simd" \
              -Dftz_DIR="$GITHUB_WORKSPACE/build/relocated packages/ftz/lib/cmake/ftz" \
              -DCMAKE_FIND_USE_PACKAGE_REGISTRY=OFF -DCMAKE_FIND_USE_SYSTEM_PACKAGE_REGISTRY=OFF \
              "${extra[@]}" "${options[@]}" 2>&1 | tee "build/logs/$suite-configure.log"
            cmake --build "build/$suite" --parallel 2 2>&1 | tee "build/logs/$suite-build.log"
            ctest --test-dir "build/$suite" --no-tests=error --output-on-failure \
              --output-junit "$GITHUB_WORKSPACE/build/logs/$suite-tests.xml" \
              2>&1 | tee "build/logs/$suite-test.log"
          done
      - name: Record compiler cache statistics
        if: always() && steps.sccache.outcome == 'success'
        run: |
          mkdir -p build/logs
          sccache --version | tee build/logs/sccache-version.txt
          sccache --show-adv-stats | tee build/logs/sccache-stats.txt
          sccache --show-stats --stats-format=json > build/logs/sccache-stats.json
          {
            echo '### Producer compiler cache (SIMD and FTZ)'
            echo '```text'
            cat build/logs/sccache-version.txt build/logs/sccache-stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain package diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-logs-${{ matrix.runner }}-${{ matrix.profile }}
          if-no-files-found: warn
          path: |
            build/logs/
            build/ftz/tests/log/mpfr-*.txt
            build/sccache-pch-probe/
            build/*/CMakeCache.txt
            build/*/compile_commands.json
            build/*/CMakeFiles/CMakeConfigureLog.yaml
            build/*/Testing/Temporary/
